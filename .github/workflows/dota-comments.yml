name: Dota2 comments to Discord

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-comments:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check for new comments
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error
          import time

          OWNER = "ilushkabond"
          REPO = "test"
          ISSUE = 1
          STATE = ".github/last_comment_id"

          if os.path.exists(STATE):
              with open(STATE) as f:
                  last_id = int(f.read().strip())
          else:
              last_id = None

          url = (
              f"https://api.github.com/repos/{OWNER}/{REPO}"
              f"/issues/{ISSUE}/comments?per_page=100"
          )

          req = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "dota2-discord-bot"
              }
          )

          with urllib.request.urlopen(req) as r:
              comments = json.load(r)

          if not comments:
              print("No comments.")
              raise SystemExit

          newest_id = max(c["id"] for c in comments)

          # Первый запуск: только запоминаем последний комментарий.
          if last_id is None:
              os.makedirs(os.path.dirname(STATE), exist_ok=True)
              with open(STATE, "w") as f:
                  f.write(str(newest_id))
              print(f"Initialized at comment {newest_id}")
              raise SystemExit

          new_comments = [
              c for c in comments
              if c["id"] > last_id
          ]

          print(f"Found {len(new_comments)} new comments.")

          webhook = os.environ["DISCORD_WEBHOOK"]

          for comment in sorted(new_comments, key=lambda x: x["id"]):
              username = comment["user"]["login"]
              body = comment["body"]
              link = comment["html_url"]

              # Discord content limit.
              if len(body) > 1800:
                  body = body[:1800] + "\n…"

              payload = {
                  "embeds": [{
                      "title": f"💬 New comment on Dota2 #{ISSUE}",
                      "description": body,
                      "url": link,
                      "author": {
                          "name": username
                      },
                      "footer": {
                          "text": "ValveSoftware/Dota2-Gameplay"
                      }
                  }],
                  "allowed_mentions": {
                      "parse": []
                  }
              }

              data = json.dumps(payload).encode("utf-8")

              request = urllib.request.Request(
                  webhook,
                  data=data,
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "dota2-discord-bot"
                  },
                  method="POST"
              )

              with urllib.request.urlopen(request) as r:
                  print(
                      f"Discord: comment {comment['id']} "
                      f"→ HTTP {r.status}"
                  )

              time.sleep(1)

          os.makedirs(os.path.dirname(STATE), exist_ok=True)

          with open(STATE, "w") as f:
              f.write(str(newest_id))
          PY

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last_comment_id
          git diff --cached --quiet || git commit -m "Update last comment ID"
          git push
